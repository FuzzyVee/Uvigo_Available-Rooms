<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESEI · Room availability</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2b3442;
    --text:#e6edf3; --muted:#8b98a9;
    --free:#22c55e; --free-bg:rgba(34,197,94,.12);
    --busy:#f59e0b; --busy-bg:rgba(245,158,11,.12);
    --accent:#58a6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       max-width:1100px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;
         margin-bottom:6px}
  h1{font-size:1.5rem;letter-spacing:.3px}
  h1 span{color:var(--accent)}
  #clock{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:20px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
            background:var(--panel);border:1px solid var(--border);border-radius:12px;
            padding:12px 14px;margin-bottom:22px}
  .controls label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  input,button{background:var(--panel2);border:1px solid var(--border);color:var(--text);
               border-radius:8px;padding:7px 10px;font-size:.9rem}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.active{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
  h2{font-size:1.05rem;margin:26px 0 12px;color:var(--muted);text-transform:uppercase;
     letter-spacing:1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
        padding:14px;border-left:5px solid var(--free)}
  .card.busy{border-left-color:var(--busy)}
  .room{font-weight:700;font-size:1.05rem;margin-bottom:6px}
  .pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.5px;
        padding:3px 9px;border-radius:999px;margin-bottom:8px}
  .card.free .pill{background:var(--free-bg);color:var(--free)}
  .card.busy .pill{background:var(--busy-bg);color:var(--busy)}
  .cls{font-size:.9rem}
  .cls .time{color:var(--muted);font-size:.8rem}
  .next{margin-top:8px;font-size:.78rem;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:var(--panel);
        border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);
        font-size:.88rem;vertical-align:top}
  th{background:var(--panel2);color:var(--muted);font-size:.75rem;text-transform:uppercase;
     letter-spacing:.6px}
  tr:last-child td{border-bottom:none}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--border);
        border-radius:8px;padding:3px 8px;margin:2px 3px 2px 0;font-size:.8rem;white-space:nowrap}
  .chip b{color:var(--accent);font-weight:600}
  #error{display:none;background:rgba(245,158,11,.1);border:1px solid var(--busy);
         color:var(--busy);border-radius:12px;padding:14px;margin-bottom:18px;font-size:.9rem}
  .legend{font-size:.78rem;color:var(--muted)}
  footer{margin-top:40px;color:var(--muted);font-size:.78rem;text-align:center}
</style>
</head>
<body>

<header>
  <h1>ESEI <span>·</span> Room availability</h1>
  <div id="clock">--:--:--</div>
</header>
<div class="sub">Grado en Enxeñaría Informática — built from the official ESEI public calendars</div>

<div id="error"></div>

<div class="controls">
  <label>Date <input type="date" id="date"></label>
  <label>Time <input type="time" id="time"></label>
  <button id="nowBtn" class="active">Now</button>
  <span class="legend" id="freshness"></span>
</div>

<h2 id="boardTitle">Right now</h2>
<div class="grid" id="board"></div>

<h2>Day schedule</h2>
<table>
  <thead><tr><th style="width:120px">Room</th><th>Classes</th></tr></thead>
  <tbody id="dayBody"></tbody>
</table>

<footer>Data refreshes automatically · times are Europe/Ourense</footer>

<script>
const TZ = "Europe/Madrid";
let DATA = null;

/* ---------- time helpers (all in Europe/Madrid) ---------- */
function madridParts(date = new Date()) {
  const p = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",
    day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})
    .formatToParts(date).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return {date:`${p.year}-${p.month}-${p.day}`, time:`${p.hour}:${p.minute}`,
          timeFull:`${p.hour}:${p.minute}:${p.second}`};
}
function weekdayName(iso){ // iso = YYYY-MM-DD
  const [y,m,d]=iso.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
}
const toMin = t => {const[a,b]=t.split(":").map(Number);return a*60+b;};

/* ---------- data helpers ---------- */
const eventsOn = iso => DATA.events.filter(e => e.date === iso);
function roomKey(r){ // natural sort: SO2 before SO10
  return (r||"").split(/(\d+)/).map(s=>isNaN(s)?s:+s);
}
function statusAt(evts, time){
  const t = toMin(time);
  return evts.find(e => toMin(e.start) <= t && t < toMin(e.end));
}

/* ---------- rendering ---------- */
function render(){
  const dateEl = document.getElementById("date");
  const timeEl = document.getElementById("time");
  const iso  = dateEl.value, time = timeEl.value;
  const nowIso = madridParts().date;
  const viewingNow = (iso === nowIso);
  document.getElementById("boardTitle").textContent =
    viewingNow ? "Right now" : `Status on ${weekdayName(iso)} at ${time}`;

  const evts = eventsOn(iso);
  const rooms = [...new Set(evts.map(e=>e.room).filter(Boolean))].sort((a,b)=>{
    const ka=roomKey(a), kb=roomKey(b);
    for(let i=0;i<Math.max(ka.length,kb.length);i++){
      if(ka[i]===undefined) return -1; if(kb[i]===undefined) return 1;
      if(ka[i]!==kb[i]) return ka[i]<kb[i]?-1:1;
    } return 0;
  });

  /* status board */
  const board = document.getElementById("board");
  board.innerHTML = "";
  const later = evts.filter(e => toMin(e.start) >= toMin(time))
                    .sort((a,b)=>toMin(a.start)-toMin(b.start));
  for(const room of rooms){
    const roomEvts = evts.filter(e=>e.room===room);
    const cur = statusAt(roomEvts, time);
    const nxt = later.find(e=>e.room===room);
    const card = document.createElement("div");
    card.className = "card " + (cur ? "busy" : "free");
    card.innerHTML =
      `<div class="room">${room}</div>` +
      `<span class="pill">${cur ? "BUSY" : "FREE"}</span>` +
      (cur ? `<div class="cls">${cur.subject} <span class="time">until ${cur.end}</span></div>`
           : `<div class="cls" style="color:var(--muted)">no class at this time</div>`) +
      (nxt ? `<div class="next">Next: ${nxt.start} · ${nxt.subject}</div>` : "");
    board.appendChild(card);
  }

  /* day schedule table */
  const body = document.getElementById("dayBody");
  body.innerHTML = "";
  if(!rooms.length){
    body.innerHTML = `<tr><td colspan="2" style="color:var(--muted)">No classes found for this date${iso<nowIso?" (it is in the past)":""}.</td></tr>`;
  }
  for(const room of rooms){
    const chips = evts.filter(e=>e.room===room)
      .map(e=>`<span class="chip"><b>${e.start}–${e.end}</b> ${e.subject}</span>`).join("");
    body.insertAdjacentHTML("beforeend", `<tr><td><b>${room}</b></td><td>${chips}</td></tr>`);
  }
}

/* ---------- boot ---------- */
function tick(){
  document.getElementById("clock").textContent =
    weekdayName(madridParts().date) + " · " + madridParts().timeFull + " (Madrid)";
}
async function boot(){
  tick(); setInterval(tick, 1000);
  try{
    const r = await fetch("data.json", {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
  }catch(err){
    const e = document.getElementById("error");
    e.style.display = "block";
    e.textContent = "⚠ Could not load data.json — if you are opening this file locally, run a tiny server first:  python -m http.server   (or push to GitHub Pages, where it works out of the box).";
    return;
  }
  document.getElementById("freshness").textContent =
    "data updated: " + new Date(DATA.generated_at).toLocaleString();

  /* default date: today, or the first date that actually has events */
  const today = madridParts().date;
  const dates = [...new Set(DATA.events.map(e=>e.date))].sort();
  const def = dates.includes(today) ? today : (dates.find(d=>d>=today) || dates[0] || today);
  const dateEl = document.getElementById("date");
  const timeEl = document.getElementById("time");
  dateEl.value = def;
  timeEl.value = madridParts().time;

  const syncNowBtn = () =>
    document.getElementById("nowBtn").classList.toggle("active",
      dateEl.value === madridParts().date);
  [dateEl,timeEl].forEach(el=>el.addEventListener("input", ()=>{syncNowBtn();render();}));
  document.getElementById("nowBtn").addEventListener("click", ()=>{
    dateEl.value = madridParts().date; timeEl.value = madridParts().time;
    syncNowBtn(); render();
  });

  render();
  /* keep "now" fresh */
  setInterval(()=>{
    if(document.getElementById("nowBtn").classList.contains("active")){
      timeEl.value = madridParts().time;
      dateEl.value = madridParts().date;
      render();
    }
  }, 30000);
}
boot();
</script>
</body>
</html>
