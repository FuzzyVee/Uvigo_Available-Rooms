name: Update room data

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:           # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install icalendar recurring-ical-events

      - name: Scrape calendars
        run: python scraper.py

      - name: Pull latest changes to avoid push conflicts
        run: git pull --rebase origin main

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update room data"
          file_pattern: "data.json"
